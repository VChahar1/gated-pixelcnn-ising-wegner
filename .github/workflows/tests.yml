name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile 3d_ising_pixel.py gate_ising.py gate_pixel.py py_func.py scripts/diagnostic.py tests/test_numerics.py
      - run: python -m pytest -q
      - run: python scripts/diagnostic.py
